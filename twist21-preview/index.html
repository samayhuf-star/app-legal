<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twist 21 — App Preview</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2a2f3a,#0e1015);font-family:-apple-system,system-ui,sans-serif;color:#cbd2dc;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{position:relative;width:390px;height:800px;border-radius:62px;background:#111;padding:14px;box-shadow:0 0 0 3px #3b3f48,0 0 0 8px #1b1d22,0 30px 80px rgba(0,0,0,.6);transform-origin:top center}
.screen{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:#F5EEDF}
iframe{width:100%;height:100%;border:0;background:#F5EEDF}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:5;pointer-events:none}
.btn{position:absolute;width:4px;background:#2a2d34;border-radius:2px}
.l1{left:-9px;top:130px;height:30px}.l2{left:-9px;top:185px;height:56px}.l3{left:-9px;top:255px;height:56px}.r1{right:-9px;top:200px;height:90px;cursor:pointer}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:#2B2118;opacity:.55;z-index:5;pointer-events:none}
.cap{font-size:13px;opacity:.7}
.off{position:absolute;inset:0;background:#000;z-index:9;display:none}
</style></head><body>
<div class="wrap"><div class="phone" id="p">
<div class="btn l1"></div><div class="btn l2"></div><div class="btn l3"></div><div class="btn r1" id="pw" title="Side button: reload app"></div>
<div class="screen"><div class="island"></div><div class="home"></div><div class="off" id="off"></div><iframe id="f" src="/app.html"></iframe></div>
</div><div class="cap">Twist 21 · interactive preview · side button reloads</div></div>
<script>
function fit(){var s=Math.min(1,(innerHeight-40)/860);p.style.transform="scale("+s+")";p.style.marginBottom=(-(1-s)*800)+"px"}
addEventListener("resize",fit);fit();
pw.onclick=function(){off.style.display="block";setTimeout(function(){f.src="/app.html";off.style.display="none"},500)};
</script></body></html>
